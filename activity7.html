<!DOCTYPE html>
<html>
<head>
    <title>JavaScript</title>
    <link rel="stylesheet" href="activity7.css">
</head>

<body>

    <div class="card">
        <h2>My First JavaScript</h2>

        <button onclick="showDate()">Click to Show Date & Time</button>

        <p id="demo"></p>
    </div>

    <script>
        function showDate() {
            document.getElementById("demo").innerHTML = new Date().toLocaleString();
        }
    </script>

</body>
</html>
